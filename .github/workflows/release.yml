name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG#v}"
          if [[ -z "$version" || "$version" == "$TAG" ]]; then
            echo "release tags must use the v<version> format: $TAG" >&2
            exit 1
          fi

          rm -rf dist
          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            name="fx-openai_${version}_${goos}_${goarch}"
            work="$(mktemp -d)"
            binary="$name/fx-openai"
            if [[ "$goos" == "windows" ]]; then
              binary+=".exe"
            fi

            mkdir -p "$work/$name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X fx-openai/internal/version.String=$version" \
              -o "$work/$binary" ./cmd/fx-openai

            cp README.md LICENSE "$work/$name/"
            if [[ "$goos" == "windows" ]]; then
              (cd "$work" && zip -q -r "$OLDPWD/dist/$name.zip" "$name")
            else
              tar -C "$work" -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "$work"
          done

          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "fx-openai ${TAG#v}" \
            --generate-notes
